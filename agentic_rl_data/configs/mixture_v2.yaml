# =============================================================================
# agentic_rl_data/configs/mixture_v2.yaml  --  Qwen3-4B agentic RL, up to 24 turns
#
# Goal: tool-call accuracy + long-horizon agentic skills (planning, reflection,
# interleaved multi-user dialogue, clarification, parallel calls and recovery).
#
#   * multi-turn is 50%: 90% outcome-verified generated tasks and 10% replay
#     (Toucan / APIGen-MT) for real API and schema diversity.
#   * single-turn function calling is 20%, including generated parallel and
#     parameter-precision tasks as an anti-forgetting anchor.
#   * multi-hop search is 20%, math+python is 8%, and Hammer irrelevance is
#     an independent 2% category.
#
# Size: 12000 train rows. Per-source caps below are exact at this baseline and
# scale linearly when --total-train is overridden.
# =============================================================================

version: 2
seed: 20251106
total_train: 12000

paths:
  raw_dir: data/raw_unified

output:
  dir: data/mixture_v2
  train: train.jsonl
  heldout: heldout.jsonl
  stats: mixture_stats.json
  emit_curriculum: true

passrate:
  enabled: true
  band:
    min: 0.125
    max: 0.875
  n_samples: 8
  # Pass-rate files come from scripts/estimate_passrate (one vLLM pass of the
  # base model, N=8). Missing rows are kept: DAPO filtering in the recipe
  # removes all-0 / all-1 groups online anyway.
  missing: keep
  smoothed: false
  require_report: false

heldout:
  per_category: 200
  group_aware: true
  oversample: 4

filters:
  max_gt_turns: 24
  invalid_schema: drop
  dedup:
    exact: true
    approximate:
      enabled: true
      method: minhash
      jaccard: 0.85
      num_perm: 64
      priority_sources:
        - toolace
        - apigen
  decontam:
    enabled: true
    bfcl_v3: true
    bfcl_v4: true
    ngram: 5
    jaccard: 0.90
    hit_policy: drop
    report_required: false
  mt_fc:
    # replay rows without real tool returns are never trained on
    placeholder_gt_returns: drop
    placeholder_keep_share: 0.0
    placeholder_weight: 0.5

curriculum:
  enabled: true
  filter_gt_turns: 24
  # short-to-long; the recipe trains stage files in order (see run script)
  stages:
    - max_turns: 8
      start_fraction: 0.0
      end_fraction: 0.3
    - max_turns: 16
      start_fraction: 0.3
      end_fraction: 0.6
    - max_turns: 24
      start_fraction: 0.6
      end_fraction: 1.0

sources:
  # --- single-turn anchor (stage-0 data, exact counts) ------------------------
  apigen:
    file: apigen.jsonl
    task_type: st_fc
    required: true
  toolace:
    file: toolace.jsonl
    task_type: st_fc
    required: true
  sealtools:
    file: sealtools.jsonl
    task_type: st_fc
    required: false
  apibank:
    file: apibank.jsonl
    task_type: st_fc
    required: true
  hammer:
    file: hammer.jsonl
    task_type: irrelevance
    required: true

  # --- outcome-verified generated tasks ---------------------------------------
  procedural_st:
    file: procedural_st.jsonl
    task_type: st_fc
    required: true
    license: "generated (repo-internal)"
  procedural_mt:
    file: procedural_mt.jsonl
    task_type: mt_fc
    required: true
    license: "generated (repo-internal)"
    note: "generators/stateful_tasks.py: 3 domains x 13 templates, self-verified"
  interleaved_mt:
    file: interleaved_mt.jsonl
    task_type: mt_fc
    required: true
    license: "generated (repo-internal)"
  stateful_abstain:
    file: stateful_abstain.jsonl
    task_type: mt_fc
    required: true
    license: "generated (repo-internal)"
  vehicle_travel_mt:
    file: vehicle_travel_mt.jsonl
    task_type: mt_fc
    required: true
    license: "generated (repo-internal)"
  social_ops_mt:
    file: social_ops_mt.jsonl
    task_type: mt_fc
    required: true
    license: "generated (repo-internal)"
  parallel_mt:
    file: parallel_mt.jsonl
    task_type: mt_fc
    required: true
    license: "generated (repo-internal)"

  # --- replay multi-turn (style / tool-schema diversity only) -----------------
  toucan:
    file: toucan.jsonl
    task_type: mt_fc
    required: false
    subsample: 1200
  apigen_mt:
    file: apigen_mt.jsonl
    task_type: mt_fc
    required: false

  # --- multi-hop search with a local per-task corpus ---------------------------
  multihop_local:
    file: multihop_local.jsonl
    task_type: search_qa
    required: true
    note: "HotpotQA-distractor + 2Wiki + MuSiQue-ans, 2-4 hops, in-memory BM25"

  # --- math + python (reasoning retention) -------------------------------------
  reasoning_math:
    file: reasoning_math.jsonl
    task_type: math_ci
    required: false

categories:
  multi_turn:
    # 90% generated outcome-verified tasks; 10% real-return replay
    share: 0.50
    heldout: 300
    turn_cap: 24
    on_unavailable: fail
    sources:
      - name: procedural_mt
        weight: 0.20
        cap: 1200
      - name: interleaved_mt
        weight: 0.15
        cap: 900
      - name: stateful_abstain
        weight: 0.20
        cap: 1200
      - name: vehicle_travel_mt
        weight: 0.15
        cap: 900
      - name: social_ops_mt
        weight: 0.15
        cap: 900
      - name: parallel_mt
        weight: 0.05
        cap: 300
      - name: toucan
        weight: 0.066667
        cap: 400
      - name: apigen_mt
        weight: 0.033333
        cap: 200

  single_turn:
    share: 0.20
    heldout: 200
    turn_cap: 15
    on_unavailable: fail
    sources:
      - name: procedural_st
        weight: 0.416667
        cap: 1000
      - name: apigen
        weight: 0.25
        cap: 600
      - name: toolace
        weight: 0.1875
        cap: 450
      - name: sealtools
        weight: 0.104166
        cap: 250
      - name: apibank
        weight: 0.041667
        cap: 100

  search_qa:
    # multi-hop retrieval: query planning, reformulation, evidence chaining
    share: 0.20
    heldout: 200
    turn_cap: 12
    on_unavailable: fail
    sources:
      - name: multihop_local
        weight: 1.0
        cap: 2400

  math_ci:
    share: 0.08
    heldout: 200
    turn_cap: 15
    on_unavailable: redistribute
    sources:
      - name: reasoning_math
        weight: 1.0
        cap: 960

  irrelevance:
    share: 0.02
    heldout: 200
    turn_cap: 15
    on_unavailable: fail
    sources:
      - name: hammer
        weight: 1.0
        cap: 240
